name: AWS OIDC Authentication Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-authentication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            core.setOutput('token', token);

      - name: Decode OIDC token
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          python - <<'PY'
          import os
          import base64
          import json

          token = os.environ['OIDC_TOKEN']
          header, payload, signature = token.split('.')
          payload += '=' * (-len(payload) % 4)
          decoded = base64.urlsafe_b64decode(payload)
          claims = json.loads(decoded)

          print(json.dumps({
              "iss": claims.get("iss"),
              "aud": claims.get("aud"),
              "sub": claims.get("sub"),
              "repository": claims.get("repository"),
              "repository_owner": claims.get("repository_owner"),
              "ref": claims.get("ref"),
              "event_name": claims.get("event_name"),
          }, indent=2))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: githublink

      - name: Test OIDC authentication
        run: |
          aws sts get-caller-identity